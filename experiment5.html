```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>

<style>

body{
background:black;
font-family:Arial, Helvetica, sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.calculator{
width:320px;
}

.display{
color:white;
font-size:48px;
text-align:right;
padding:20px;
word-wrap:break-word;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:15px;
}

button{
height:70px;
border-radius:50%;
border:none;
font-size:24px;
cursor:pointer;
}

.number{
background:#333;
color:white;
}

.operator{
background:#ff9500;
color:white;
}

.function{
background:#a5a5a5;
color:black;
}

button:active{
transform:scale(0.95);
}

</style>

</head>

<body>

<div class="calculator">

<div class="display" id="display">0</div>

<div class="buttons">

<button class="function" onclick="clearDisplay()">AC</button>
<button class="function" onclick="deleteLast()">⌫</button>
<button class="function" onclick="percentage()">%</button>
<button class="operator" onclick="append('/')">÷</button>

<button class="number" onclick="append('7')">7</button>
<button class="number" onclick="append('8')">8</button>
<button class="number" onclick="append('9')">9</button>
<button class="operator" onclick="append('*')">×</button>

<button class="number" onclick="append('4')">4</button>
<button class="number" onclick="append('5')">5</button>
<button class="number" onclick="append('6')">6</button>
<button class="operator" onclick="append('-')">−</button>

<button class="number" onclick="append('1')">1</button>
<button class="number" onclick="append('2')">2</button>
<button class="number" onclick="append('3')">3</button>
<button class="operator" onclick="append('+')">+</button>

<button class="number" onclick="toggleSign()">+/-</button>
<button class="number" onclick="append('0')">0</button>
<button class="number" onclick="append('.')">.</button>
<button class="operator" onclick="calculate()">=</button>

</div>

</div>

<script>

let display = document.getElementById("display");

function append(value){
if(display.innerText === "0"){
display.innerText = value;
}else{
display.innerText += value;
}
}

function clearDisplay(){
display.innerText = "0";
}

function deleteLast(){
display.innerText = display.innerText.slice(0,-1);
if(display.innerText==""){
display.innerText="0";
}
}

function calculate(){
try{
display.innerText = eval(display.innerText);
}catch{
display.innerText = "Error";
}
}

function percentage(){
display.innerText = eval(display.innerText)/100;
}

function toggleSign(){
display.innerText = eval(display.innerText) * -1;
}

</script>

</body>
</html>
