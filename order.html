<section class="order">

<h2>Order Form</h2>

<form>

<label>Name</label>
<input type="text" required>

<label>Email</label>
<input type="email" required>

<label>Select Product</label>
<select>

<option>Stylish Dress</option>
<option>Winter Jacket</option>
<option>Casual T-Shirt</option>
<option>Jeans</option>

</select>

<label>Quantity</label>
<input type="number" min="1">

<label>Address</label>
<textarea></textarea>

<button type="submit">Place Order</button>

</form>

</section>

<footer>
<p>Thank You For Shopping</p>
</footer>
